[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyhunter"
version = "1.0.0"
description = "Find, audit, and clean up Python installations on your system."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "mikebignell" }]
keywords = ["python", "version", "audit", "cli", "venv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
pyhunter = "pyhunter.cli:app"

[project.urls]
Homepage = "https://mikebignell.github.io/python-version-hunter"
Repository = "https://github.com/mikebignell/python-version-hunter"
Issues = "https://github.com/mikebignell/python-version-hunter/issues"

[tool.hatch.build.targets.wheel]
packages = ["pyhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["pyhunter"]
omit = ["tests/*"]
